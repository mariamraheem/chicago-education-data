name: Update Illinois Report Card

# Drop this file into .github/workflows/update-illinois-report-card.yml at
# the repo root (GitHub only runs workflows that live there).

on:
  schedule:
    # Monthly, 1st of the month, 06:30 UTC (offset from update-enrollment.yml's
    # 06:00 so the two don't start at the exact same minute). ISBE publishes a
    # new Public Data Set roughly once a year, often months after that school
    # year ends, so most scheduled runs will find nothing new and commit
    # nothing -- that's expected, not a bug. Use "Run workflow" below, or
    # watch this workflow's run history, to check sooner than the schedule.
    - cron: "30 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape ISBE Illinois Report Card Public Data Sets
        run: python illinois_report_card/scripts/01_scrape.py

      - name: Clean General/General (2) files
        run: python illinois_report_card/scripts/02_clean.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add illinois_report_card/data
          git diff --cached --quiet && exit 0
          git commit -m "illinois_report_card: scrape/clean $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed (remote moved) -- retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Could not push after 5 attempts -- remote kept moving."
          exit 1
