# monitor/known_urls.yaml
#
# Seed pages for the broad site-wide watch, and the path prefixes the
# crawler is allowed to follow links into. Mirrors the manual-fallback
# role that budget/known_urls.yaml plays for 01_scrape.py -- add a hub
# page here any time you spot one the crawler missed. Check
# monitor/data/run_log.jsonl's pages_visited count over time as a rough
# coverage sanity check.

