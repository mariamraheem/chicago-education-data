name: Update Enrollment Dashboard

# Scrapes/cleans/compiles/builds enrollment data AND deploys the dashboard
# to GitHub Pages, all in one run -- no monitor crawl, no git commit.
#
# This is the "skip-git" version: main has a ruleset requiring changes to
# go through a pull request, which blocks a plain `git push` from this
# workflow. Rather than fight that, this workflow just never commits --
# it re-scrapes/rebuilds fresh data every run and publishes straight to
# Pages (a separate deploy mechanism from git push, so the ruleset doesn't
# apply to it at all). Trade-off: raw scraped files (enrollment/data/raw)
# and clean/compiled CSVs are NOT archived in git history this way -- they
# only exist as this run's temporary build output. If/when you want that
# archive back, see enrollment/scripts/01-04 run the same way from
# update-enrollment.yml, which uploads the same output as a downloadable
# artifact instead of committing it.
#
# Note: this replaces whatever is currently live on Pages with just the
# enrollment dashboard. If update-monitor.yml's own site content is live at
# the time this runs, this deploy overwrites it (and vice versa -- the next
# update-monitor.yml run will overwrite this). The two workflows are not
# coordinated; whichever ran most recently is what's live.

on:
  schedule:
    # Monthly, 1st of the month, 06:30 UTC -- half an hour after
    # update-enrollment.yml's schedule, purely so they don't contend for
    # the "pages" concurrency group at the exact same minute.
    - cron: "30 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape CPS demographics reports
        run: python enrollment/scripts/01_scrape.py

      - name: Clean GENERAL/RACE files
        run: python enrollment/scripts/02_clean.py

      - name: Compile network/district aggregates
        run: python enrollment/scripts/03_compile.py

      - name: Build frontend-ready dashboard data
        run: python enrollment/scripts/04_build_dashboard_data.py

      - name: Prepare Pages site from enrollment/dashboard/
        run: |
          mkdir -p site
          cp -r enrollment/dashboard/. site/

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
