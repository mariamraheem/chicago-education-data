name: Update Site

# Assembles and deploys the whole GitHub Pages site -- NO scraping here:
#   /              home page: overview, Student health (YRBS), School climate (5Essentials)
#   /enrollment/   enrollment dashboard
#   /budget/       budget dashboard
#   /monitor/      CPS file monitor (built from the committed monitor/data)
#   /api/          JSON export API, manifest, and trend summaries
#
# It runs whenever a data workflow finishes (their bot commits can't trigger
# a push event), on pushes that touch the site or its data, and on demand.
# This is now the ONLY workflow that deploys Pages, so the monitor no longer
# overwrites the rest of the site.

on:
  push:
    branches: [main]
    paths:
      - "enrollment/dashboard/**"
      - "budget/dashboard/**"
      - "yrbs/data/clean/**"
      - "five_essentials/data/clean/**"
      - "monitor/**"
      - "site-landing/**"
      - "scripts/build_site_manifest.py"
      - "scripts/build_trends.py"
  workflow_run:
    workflows: ["Update Enrollment", "Update Budget", "Update YRBS", "Update 5Essentials", "Update Monitor"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assemble Pages site
        run: |
          mkdir -p site/enrollment site/budget site/monitor
          cp -r site-landing/. site/
          cp -r enrollment/dashboard/. site/enrollment/
          cp -r budget/dashboard/. site/budget/

      - name: Build file monitor page from committed scan data
        run: |
          python monitor/02_export_api.py
          python monitor/03_render_dashboard.py
          cp -r monitor/site/. site/monitor/

      - name: Build JSON export API, manifest and trend summaries
        run: python scripts/build_site_manifest.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
