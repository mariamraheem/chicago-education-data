name: Update Site

# Fast site assembly + deploy -- NO scraping here. It assumes
# update-enrollment.yml and update-budget.yml have already committed fresh
# data to main (they run on their own schedule / on demand), and just
# copies what's currently committed into a Pages site: the landing page,
# the enrollment tab, the budget tab, and a JSON export API + manifest for
# all of it. Runs in seconds, so it's safe to fire on every push that
# touches either dashboard's files, not just manually.
#
# Note: this replaces whatever is currently live on Pages, including
# update-monitor.yml's own site content if that's what's live at the time.
# The two are not coordinated; whichever workflow ran most recently wins.

on:
  push:
    branches: [main]
    paths:
      - "enrollment/dashboard/**"
      - "budget/dashboard/**"
      - "site-landing/**"
      - "scripts/build_site_manifest.py"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assemble Pages site
        run: |
          mkdir -p site/enrollment site/budget
          cp -r site-landing/. site/
          cp -r enrollment/dashboard/. site/enrollment/
          cp -r budget/dashboard/. site/budget/

      - name: Build JSON export API + manifest
        run: python scripts/build_site_manifest.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
