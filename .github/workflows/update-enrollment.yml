name: Update Enrollment

on:
  schedule:
    # Monthly, 1st of the month, 06:00 UTC. CPS only publishes new 20th-day
    # enrollment reports a few times a year, so most scheduled runs will
    # find nothing new and commit nothing -- that's expected, not a bug.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scrape-clean-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape CPS demographics reports
        run: python enrollment/scripts/01_scrape.py

      - name: Clean GENERAL/RACE files
        run: python enrollment/scripts/02_clean.py

      - name: Compile network/district aggregates
        run: python enrollment/scripts/03_compile.py

      - name: Build frontend-ready dashboard data
        run: python enrollment/scripts/04_build_dashboard_data.py

      # No commit/push here on purpose -- main requires changes to go
      # through a pull request, and that's a decision for a person, not
      # this workflow. Download the artifact below from the run's summary
      # page and add whichever files you want into the repo yourself.
      - name: Upload scraped/clean/compiled data as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: enrollment-data-${{ github.run_id }}
          path: |
            enrollment/data/raw
            enrollment/data/clean
            enrollment/dashboard/enrollment_dashboard_data.csv
          retention-days: 14
